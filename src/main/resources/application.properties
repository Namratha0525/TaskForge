spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskforge}
spring.datasource.username=${DATABASE_USER:taskforge}
spring.datasource.password=${DATABASE_PASSWORD:taskforge-demo}
spring.sql.init.mode=always
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false
spring.lifecycle.timeout-per-shutdown-phase=5s
taskforge.redis.enabled=${REDIS_ENABLED:false}
taskforge.token=${TASKFORGE_TOKEN}
taskforge.workers=${WORKERS:3}
taskforge.lease-seconds=${LEASE_SECONDS:6}
server.port=${PORT:8080}
server.error.include-message=never
