x-taskforge: &taskforge
  build: .
  environment: &taskforge-env
    DATABASE_URL: jdbc:postgresql://postgres:5432/taskforge
    DATABASE_USER: taskforge
    DATABASE_PASSWORD: taskforge-demo
    TASKFORGE_TOKEN: local-taskforge-demo-token
    REDIS_HOST: redis
    REDIS_ENABLED: "${REDIS_ENABLED:-false}"
    WORKERS: "0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge-demo
      POSTGRES_DB: taskforge
    volumes:
      - taskforge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U taskforge -d taskforge"]
      interval: 2s
      timeout: 4s
      retries: 30
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    profiles: ["redis"]
  api:
    <<: *taskforge
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 4s
      retries: 30
  worker:
    <<: *taskforge
    environment:
      <<: *taskforge-env
      WORKERS: "${WORKERS:-3}"
    command: ["--spring.main.web-application-type=none", "--spring.sql.init.mode=never"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  taskforge-data:
